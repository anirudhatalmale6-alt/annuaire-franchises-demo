<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Franchises hotelieres &middot; section a part</title>
<style>
*{box-sizing:border-box}
:root{
  --lime:#c9f31d; --encre:#101319; --gris:#5d6472; --trait:#e3e6ec;
  --fond:#f6f7f9; --blanc:#fff; --ombre:0 1px 2px rgba(16,19,25,.06);
}
html,body{margin:0}
body{font:15px/1.55 system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  background:var(--fond);color:var(--encre);-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font-family:inherit}
.wrap{max-width:1240px;margin:0 auto;padding:0 20px}

header{background:var(--encre);color:#fff;position:sticky;top:0;z-index:30}
.top{display:flex;align-items:center;gap:18px;padding:14px 20px}
.logo{font-weight:800;font-size:19px;letter-spacing:-.2px}
.logo b{color:var(--lime)}
.logo span{font-weight:400;font-size:12px;color:#8b93a5;margin-left:8px}
.logo .ph-marque{border:1px dashed #3a4150;border-radius:5px;padding:1px 7px;font-size:11px;letter-spacing:.06em;text-transform:uppercase}
.top nav{display:flex;gap:18px;font-size:13.5px;color:#aeb5c2;margin-left:8px}
.top nav a{cursor:pointer}
.top nav a:hover{color:#fff}
.droite{margin-left:auto;display:flex;align-items:center;gap:12px}
.lang{display:flex;border:1px solid #2c313d;border-radius:7px;overflow:hidden}
.lang button{background:none;border:0;color:#aeb5c2;padding:6px 11px;font-size:12.5px;
  cursor:pointer}
.lang button.on{background:var(--lime);color:var(--encre);font-weight:700}

.demo{background:#fff6d6;border-bottom:1px solid #f0e2a8;color:#6b5a12;
  font-size:12.5px;padding:9px 0}
.demo b{color:#4a3d06}

.hero{background:var(--encre);color:#fff;padding:34px 0 40px}
.hero h1{margin:0 0 8px;font-size:31px;line-height:1.2;letter-spacing:-.5px;max-width:760px}
.hero p{margin:0 0 20px;color:#aeb5c2;font-size:15px;max-width:660px}
.rech{display:flex;gap:10px;max-width:720px}
.rech input{flex:1;border:0;border-radius:9px;padding:13px 15px;font-size:15px;
  font-family:inherit;min-width:0}
.rech input:focus{outline:2px solid var(--lime)}
.rech button{background:var(--lime);color:var(--encre);border:0;border-radius:9px;
  padding:0 22px;font-weight:700;font-size:14.5px;cursor:pointer;white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.chips button{background:#1b202a;border:1px solid #2c313d;color:#c9cfdb;border-radius:20px;
  padding:6px 13px;font-size:12.5px;cursor:pointer}
.chips button:hover{border-color:var(--lime);color:#fff}
.chips button.on{background:var(--lime);border-color:var(--lime);color:var(--encre);
  font-weight:600}
.marches{display:flex;flex-wrap:wrap;gap:22px;margin-top:24px;
  border-top:1px solid #222834;padding-top:18px}
.marche{font-size:12.5px;color:#8b93a5}
.marche b{display:block;color:#fff;font-size:20px;font-weight:800;letter-spacing:-.3px}

.corps{display:grid;grid-template-columns:272px 1fr;gap:26px;padding:26px 0 60px;
  align-items:start}
.filtres{background:var(--blanc);border:1px solid var(--trait);border-radius:12px;
  padding:4px 16px 16px;position:sticky;top:74px;box-shadow:var(--ombre);
  max-height:calc(100vh - 96px);overflow:auto}
.fgrp{padding:14px 0;border-bottom:1px solid var(--trait)}
.fgrp:last-child{border-bottom:0}
.fgrp h3{margin:0 0 9px;font-size:11.5px;text-transform:uppercase;letter-spacing:.7px;
  color:var(--gris);font-weight:700}
.fgrp label{display:flex;align-items:center;gap:8px;font-size:13.5px;padding:3px 0;
  cursor:pointer}
.fgrp label input{accent-color:var(--lime);width:15px;height:15px;flex:0 0 15px}
.fgrp label span.n{margin-left:auto;color:#9aa1ae;font-size:12px}
select,.nb{width:100%;border:1px solid var(--trait);border-radius:8px;padding:9px 10px;
  font-size:13.5px;font-family:inherit;background:#fff;color:var(--encre)}
.raz{width:100%;background:#fff;border:1px solid var(--trait);border-radius:8px;
  padding:9px;font-size:13px;cursor:pointer;color:var(--gris);margin-top:14px}
.raz:hover{border-color:var(--encre);color:var(--encre)}
.scroll{max-height:206px;overflow:auto;margin-right:-6px;padding-right:6px}

.entete-res{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.entete-res .cpt{font-size:14px;color:var(--gris)}
.entete-res .cpt b{color:var(--encre);font-size:16px}
.entete-res .tri{margin-left:auto;display:flex;align-items:center;gap:8px;
  font-size:13px;color:var(--gris)}
.entete-res .tri select{width:auto}

.grille{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(290px,1fr))}
.fiche{background:var(--blanc);border:1px solid var(--trait);border-radius:12px;
  padding:16px 17px 14px;display:flex;flex-direction:column;gap:9px;
  box-shadow:var(--ombre);transition:border-color .15s,transform .15s}
.fiche:hover{border-color:#b9c0cd;transform:translateY(-1px)}
.fiche .haut{display:flex;align-items:baseline;gap:8px}
.fiche .cat{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--gris);
  font-weight:600;flex:1}
.fiche .org{font-size:11px;color:#8b93a5;white-space:nowrap}
.fiche h2{margin:0;font-size:17px;letter-spacing:-.2px}
.fiche .res{font-size:13.2px;color:#4e5563;flex:1}
.fiche dl{margin:0;display:grid;grid-template-columns:auto auto;gap:4px 10px;
  font-size:12.8px;border-top:1px solid var(--trait);padding-top:10px}
.fiche dt{color:var(--gris)}
.fiche dd{margin:0;text-align:right;font-weight:600}
.fiche .bas{display:flex;align-items:center;gap:8px;margin-top:4px}
.fiche .bas .cta{background:var(--encre);color:#fff;border:0;border-radius:8px;
  padding:9px 14px;font-size:13px;font-weight:600;cursor:pointer;flex:1}
.fiche .bas .cta:hover{background:#000}
.fiche .bas .cmp{border:1px solid var(--trait);background:#fff;border-radius:8px;
  padding:9px 11px;font-size:12.5px;cursor:pointer;color:var(--gris)}
.fiche .bas .cmp.on{border-color:var(--lime);background:#f7ffdd;color:var(--encre);
  font-weight:600}
.vide{background:#fff;border:1px dashed var(--trait);border-radius:12px;padding:50px 20px;
  text-align:center;color:var(--gris)}
.plus{display:block;margin:22px auto 0;background:#fff;border:1px solid var(--trait);
  border-radius:9px;padding:11px 26px;font-size:14px;cursor:pointer}
.plus:hover{border-color:var(--encre)}

.barcmp{position:fixed;left:0;right:0;bottom:0;background:var(--encre);color:#fff;
  z-index:40;transform:translateY(110%);transition:transform .18s}
.barcmp.on{transform:none}
.barcmp .in{display:flex;align-items:center;gap:12px;padding:12px 20px;flex-wrap:wrap}
.barcmp .n{font-size:13.5px;color:#aeb5c2}
.barcmp .pastille{background:#1b202a;border:1px solid #2c313d;border-radius:20px;
  padding:5px 11px;font-size:12.5px}
.barcmp .pastille b{cursor:pointer;color:#8b93a5;margin-left:6px}
.barcmp .go{margin-left:auto;background:var(--lime);color:var(--encre);border:0;
  border-radius:8px;padding:10px 18px;font-weight:700;font-size:13.5px;cursor:pointer}

.voile{position:fixed;inset:0;background:rgba(16,19,25,.55);z-index:50;display:none}
.voile.on{display:block}
.panneau{position:fixed;top:0;right:0;bottom:0;width:min(620px,100%);background:#fff;
  z-index:51;overflow:auto;transform:translateX(100%);transition:transform .22s;
  box-shadow:-8px 0 30px rgba(0,0,0,.18)}
.panneau.on{transform:none}
.panneau .ph{padding:22px 26px 16px;border-bottom:1px solid var(--trait);position:sticky;
  top:0;background:#fff;z-index:2}
.panneau .ph .cat{font-size:11px;text-transform:uppercase;letter-spacing:.6px;
  color:var(--gris);font-weight:600}
.panneau .ph h2{margin:5px 0 0;font-size:23px;letter-spacing:-.3px;padding-right:44px}
.panneau .fermer{position:absolute;top:18px;right:20px;background:#f1f3f6;border:0;
  border-radius:8px;width:32px;height:32px;font-size:17px;cursor:pointer;color:var(--gris)}
.panneau .pc{padding:20px 26px 40px}
.panneau table.faits{width:100%;border-collapse:collapse;font-size:13.6px;margin:6px 0 20px}
.panneau table.faits td{padding:9px 0;border-bottom:1px solid var(--trait);
  vertical-align:top}
.panneau table.faits td:first-child{color:var(--gris);width:52%}
.panneau table.faits td:last-child{text-align:right;font-weight:600}
.panneau h4{margin:22px 0 8px;font-size:12px;text-transform:uppercase;letter-spacing:.7px;
  color:var(--gris)}
.prov{display:flex;flex-wrap:wrap;gap:6px}
.prov span{background:#f1f3f6;border-radius:6px;padding:4px 9px;font-size:12px}
.form{background:var(--fond);border:1px solid var(--trait);border-radius:12px;
  padding:18px;margin-top:8px}
.form p.i{margin:0 0 14px;font-size:13px;color:var(--gris)}
.form label{display:block;font-size:12.5px;color:var(--gris);margin:10px 0 4px}
.form input,.form select,.form textarea{width:100%;border:1px solid var(--trait);
  border-radius:8px;padding:10px;font-size:14px;font-family:inherit;background:#fff}
.form textarea{min-height:74px;resize:vertical}
.form .duo{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form button{width:100%;margin-top:16px;background:var(--lime);color:var(--encre);border:0;
  border-radius:9px;padding:13px;font-weight:700;font-size:14.5px;cursor:pointer}
.form .ok{background:#eaffd0;border:1px solid #c9f31d;border-radius:9px;padding:14px;
  font-size:13.5px;margin-top:14px}
.err{border-color:#e05252 !important}
.msg-err{color:#c0392b;font-size:12.5px;margin-top:8px}

.cmp-tbl{width:100%;border-collapse:collapse;font-size:13.4px}
.cmp-tbl th,.cmp-tbl td{border:1px solid var(--trait);padding:10px;text-align:left}
.cmp-tbl th{background:var(--fond);font-size:12px;color:var(--gris);font-weight:600}
.cmp-tbl td.h{font-weight:700}

.cats-liste{columns:2;column-gap:26px}
.cats-liste button{display:block;width:100%;text-align:left;background:none;border:0;
  border-bottom:1px solid var(--trait);padding:10px 0;font-size:14px;cursor:pointer;
  break-inside:avoid}
.cats-liste button:hover{color:#000}
.cats-liste button span{float:right;color:var(--gris);font-size:12.5px}

footer{border-top:1px solid var(--trait);background:#fff;padding:24px 0 44px;
  font-size:12.5px;color:var(--gris)}

@media(max-width:900px){
  .corps{grid-template-columns:1fr}
  .filtres{position:static;max-height:none}
  .hero h1{font-size:25px}
  .top nav{display:none}
  .cats-liste{columns:1}
}
/* Sur telephone, le libelle de marque + la pastille « marque a definir » +
   le selecteur de langue depassaient de 12 px et poussaient une barre de
   defilement laterale sur toute la page. On reduit, on ne cache pas : la
   pastille dit que le nom n'est pas arrete, elle doit se voir partout. */
@media(max-width:560px){
  .top{gap:10px;padding:12px 14px}
  .logo{font-size:16px}
  .logo .ph-marque{font-size:9.5px;padding:1px 5px;margin-left:6px}
  .lang button{padding:6px 9px}
}

/* Propre a l'hotellerie */
.grpline{font-size:11.5px;color:#8b93a5;margin:0 0 2px}
.seg{display:inline-block;background:#f1f3f6;border-radius:6px;padding:3px 9px;
  font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--gris);
  font-weight:700}
.cles{font-variant-numeric:tabular-nums}
.contrats{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.contrats span{border:1px solid var(--trait);border-radius:6px;padding:3px 8px;
  font-size:11.5px;color:var(--gris)}
.calc{font-size:12px;color:var(--gris);margin:-12px 0 18px}
.defs dt{font-weight:700;font-size:13.4px;margin-top:12px}
.defs dd{margin:3px 0 0;font-size:13.2px;color:#4e5563}
.pourquoi{background:#fff;border:1px solid var(--trait);border-radius:12px;
  padding:18px 20px;margin-bottom:18px;box-shadow:var(--ombre)}
.pourquoi h2{margin:0 0 8px;font-size:16px}
.pourquoi p{margin:0;font-size:13.4px;color:#4e5563}
.pourquoi ul{margin:10px 0 0;padding-left:18px;font-size:13.4px;color:#4e5563}
.pourquoi li{margin-bottom:4px}

</style>

<header>
  <div class="wrap top">
    <div class="logo">Annuaire<b>.</b>Franchises<span class="ph-marque">marque a definir</span><span id="lg-pays"></span></div>
    <nav>
      <a href="index.html" id="nv1"></a>
      <a id="nv4" class="on"></a>
    </nav>
    <div class="droite">
      <div class="lang">
        <button data-l="fr" class="on">FR</button><button data-l="en">EN</button>
      </div>
    </div>
  </div>
</header>

<div class="demo"><div class="wrap" id="bandeau-demo"></div></div>

<section class="hero">
  <div class="wrap">
    <h1 id="h-titre"></h1>
    <p id="h-sous"></p>
    <div class="rech">
      <input id="q" type="search" autocomplete="off">
      <button id="go"></button>
    </div>
    <div class="chips" id="chips"></div>
    <div class="marches" id="marches"></div>
  </div>
</section>

<div class="wrap">
  <div class="corps">
    <aside class="filtres" id="filtres"></aside>
    <main>
      <div class="pourquoi" id="pourquoi"></div>
      <div class="entete-res">
        <div class="cpt" id="cpt"></div>
        <div class="tri">
          <span id="tri-l"></span>
          <select id="tri"></select>
        </div>
      </div>
      <div class="grille" id="grille"></div>
      <div class="vide" id="vide" style="display:none"></div>
      <button class="plus" id="plus" style="display:none"></button>
    </main>
  </div>
</div>

<footer><div class="wrap" id="pied"></div></footer>

<div class="voile" id="voile"></div>
<div class="panneau" id="panneau"></div>

var L = 'fr';
var D = null, PAS = 12, montre = PAS;
var F = {q:'', segs:[], contrats:[], regions:[], pays:[], tranches:[],
         taille:'', conv:false, tri:'p'};

function t(k){ return T[L][k]; }
function loc(){ return L === 'fr' ? 'fr-CA' : 'en-CA'; }
var FMT = {};
function argent(v, dev){
  var k = L + dev;
  if (!FMT[k]) FMT[k] = new Intl.NumberFormat(loc(),
    {style:'currency', currency:dev, maximumFractionDigits:0});
  return FMT[k].format(v);
}
function nb(v){ return v.toLocaleString(loc()); }
/* L'espace avant le %% doit etre INSECABLE en francais : « 4,4 % » coupe en
   fin de ligne se lit « 4,4 » sur une ligne et « % » sur la suivante. */
function pct(v){
  var s = v.toLocaleString(loc(), {minimumFractionDigits:1,
                                   maximumFractionDigits:1});
  return L === 'fr' ? s + '\u00a0%' : s + '%';
}
function ech(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;')
                  .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function lib(liste, cle){
  for (var i=0;i<liste.length;i++) if (liste[i].cle === cle) return liste[i][L];
  return cle;
}
function fmt(s, o){
  return s.replace(/%\((\w+)\)[ds]/g, function(_, k){ return o[k]; });
}
function pliage(s){
  return s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
}

/* --------------------------------------------------------------- filtrage */
/* `sauf` sert aux compteurs : le nombre affiche a cote d'une case est le
   nombre de fiches qui resteraient SI on la cochait, les autres filtres en
   place. Calcule sur le resultat final, il afficherait 0 partout — exact, et
   parfaitement inutile. */
function passe(f, sauf){
  if (F.q){
    var mots = pliage(F.q).split(/\s+/).filter(Boolean);
    var champ = pliage(f.nom + ' ' + f.groupe + ' ' + f.resume.fr + ' ' +
                       f.resume.en + ' ' + lib(D.segments, f.segment) + ' ' +
                       lib(D.pays, f.pays_origine));
    for (var i=0;i<mots.length;i++) if (champ.indexOf(mots[i]) < 0) return false;
  }
  if (sauf !== 'segs' && F.segs.length && F.segs.indexOf(f.segment) < 0)
    return false;
  if (sauf !== 'contrats' && F.contrats.length){
    var ok = false;
    for (var a=0;a<F.contrats.length;a++)
      if (f.contrats.indexOf(F.contrats[a]) >= 0){ ok = true; break; }
    if (!ok) return false;
  }
  if (sauf !== 'regions' && F.regions.length && F.regions.indexOf(f.region) < 0)
    return false;
  if (sauf !== 'pays' && F.pays.length){
    var okp = false;
    for (var j=0;j<F.pays.length;j++)
      if (f.pays.indexOf(F.pays[j]) >= 0){ okp = true; break; }
    if (!okp) return false;
  }
  if (sauf !== 'tranches' && F.tranches.length &&
      F.tranches.indexOf(f.investissement_cle.tranche) < 0) return false;
  /* La taille demande « qui prend un hotel de N cles » : N doit tomber DANS
     la fourchette acceptee, pas au-dessus d'un minimum. */
  if (sauf !== 'taille' && F.taille){
    var n = parseInt(F.taille, 10);
    if (n < f.cles.min || n > f.cles.max) return false;
  }
  if (sauf !== 'conv' && F.conv && !f.conversion) return false;
  return true;
}

function liste(){
  var r = D.fiches.filter(function(f){ return passe(f, null); });
  if (F.tri === 'ic') r.sort(function(a,b){
    return a.investissement_cle.eur_bas - b.investissement_cle.eur_bas; });
  else if (F.tri === 'id') r.sort(function(a,b){
    return b.investissement_cle.eur_bas - a.investissement_cle.eur_bas; });
  else if (F.tri === 'r') r.sort(function(a,b){
    return b.reseau.hotels - a.reseau.hotels; });
  else if (F.tri === 'az') r.sort(function(a,b){
    return a.nom.localeCompare(b.nom, loc()); });
  return r;
}

function compte(sauf, test){
  var n = 0;
  for (var i=0;i<D.fiches.length;i++){
    var f = D.fiches[i];
    if (passe(f, sauf) && test(f)) n++;
  }
  return n;
}

/* ---------------------------------------------------------------- rendu */
function cocher(groupe, cle, tableau){
  var i = tableau.indexOf(cle);
  if (i < 0) tableau.push(cle); else tableau.splice(i, 1);
  montre = PAS;
  tout();
}

function bloc(titre, sauf, options, tableau, scroll){
  var h = '<div class="fgrp"><h3>' + ech(titre) + '</h3>' +
          (scroll ? '<div class="scroll">' : '');
  for (var i=0;i<options.length;i++){
    var o = options[i];
    h += '<label><input type="checkbox" data-g="' + sauf + '" data-v="' +
         ech(o.cle) + '"' + (tableau.indexOf(o.cle) >= 0 ? ' checked' : '') +
         '><span>' + ech(o.lib) + '</span><span class="n">' + o.n + '</span></label>';
  }
  return h + (scroll ? '</div>' : '') + '</div>';
}

function filtres(){
  var h = '';

  h += bloc(t('f_segment'), 'segs', D.segments.map(function(s){
    return {cle:s.cle, lib:s[L], n:compte('segs', function(f){
      return f.segment === s.cle; })};
  }), F.segs, false);

  h += bloc(t('f_contrat'), 'contrats', D.contrats.map(function(c){
    return {cle:c.cle, lib:c[L], n:compte('contrats', function(f){
      return f.contrats.indexOf(c.cle) >= 0; })};
  }), F.contrats, false);

  h += bloc(t('f_tranche'), 'tranches', D.tranches.map(function(x){
    return {cle:x.cle, lib:x[L], n:compte('tranches', function(f){
      return f.investissement_cle.tranche === x.cle; })};
  }), F.tranches, false);

  h += '<div class="fgrp"><h3>' + ech(t('f_taille')) + '</h3><select id="taille">' +
       '<option value="">' + ech(t('f_taille_0')) + '</option>';
  for (var i=0;i<D.tailles.length;i++){
    var n = D.tailles[i];
    var q = compte('taille', function(f){
      return n >= f.cles.min && n <= f.cles.max; });
    h += '<option value="' + n + '"' + (F.taille == n ? ' selected' : '') + '>' +
         ech(fmt(t('f_taille_n'), {n:n})) + ' (' + q + ')</option>';
  }
  h += '</select></div>';

  h += '<div class="fgrp"><h3>' + ech(t('f_conv')) + '</h3>' +
       '<label><input type="checkbox" id="conv"' + (F.conv ? ' checked' : '') +
       '><span>' + ech(t('f_conv_l')) + '</span><span class="n">' +
       compte('conv', function(f){ return f.conversion; }) + '</span></label></div>';

  h += bloc(t('f_region'), 'regions', D.regions.map(function(r){
    return {cle:r.cle, lib:r[L], n:compte('regions', function(f){
      return f.region === r.cle; })};
  }), F.regions, false);

  h += bloc(t('f_pays'), 'pays', D.pays.map(function(p){
    return {cle:p.cle, lib:p[L], n:compte('pays', function(f){
      return f.pays.indexOf(p.cle) >= 0; })};
  }), F.pays, true);

  h += '<button class="raz" id="raz">' + ech(t('raz')) + '</button>';

  var el = document.getElementById('filtres');
  el.innerHTML = h;
  var cases = el.querySelectorAll('input[data-g]');
  for (var k=0;k<cases.length;k++){
    cases[k].addEventListener('change', function(){
      var g = this.getAttribute('data-g');
      cocher(g, this.getAttribute('data-v'), F[g]);
    });
  }
  document.getElementById('taille').addEventListener('change', function(){
    F.taille = this.value; montre = PAS; tout();
  });
  document.getElementById('conv').addEventListener('change', function(){
    F.conv = this.checked; montre = PAS; tout();
  });
  document.getElementById('raz').addEventListener('click', function(){
    F.segs = []; F.contrats = []; F.regions = []; F.pays = [];
    F.tranches = []; F.taille = ''; F.conv = false; F.q = '';
    document.getElementById('q').value = '';
    montre = PAS; tout();
  });
}

function carte(f){
  var inv = argent(f.investissement_cle.bas, f.devise) + ' - ' +
            argent(f.investissement_cle.haut, f.devise);
  return '<article class="fiche" data-id="' + ech(f.id) + '">' +
    '<p class="grpline">' + ech(f.groupe) + '</p>' +
    '<div class="haut"><span class="seg">' + ech(lib(D.segments, f.segment)) +
    '</span></div>' +
    '<h2>' + ech(f.nom) + '</h2>' +

    '<dt>' + ech(t('c_taille')) + '</dt><dd class="cles">' + nb(f.cles.min) +
    ' - ' + nb(f.cles.max) + ' ' + ech(t('c_cles')) + '</dd>' +

    pct(f.redevances.commercialisation) + '</dd>' +

  var r = liste();
  var g = document.getElementById('grille');

  p.style.display = r.length > montre ? 'block' : 'none';
  p.textContent = t('plus');

  /* Le compteur annonce le sous-ensemble ET le total : « 12 » tout seul
     laisserait croire que la section en contient douze. */
  document.getElementById('cpt').innerHTML =
    '<b>' + nb(r.length) + '</b> ' +
    ech(r.length === 1 ? t('cpt_1') : t('cpt_n')) + ' ' +
    ech(t('cpt_sur')) + ' ' + nb(D.fiches.length);

  var cartes = g.querySelectorAll('.fiche');

function ligne(k, v){
  return '<tr><td>' + ech(k) + '</td><td>' + v + '</td></tr>';

function envoyer(){
  var nom = document.getElementById('c_nom');
  var mail = document.getElementById('c_mail');
  var res = document.getElementById('c_res');
  nom.classList.remove('err'); mail.classList.remove('err');
  if (!nom.value.trim() || !mail.value.trim()){
    if (!nom.value.trim()) nom.classList.add('err');
    if (!mail.value.trim()) mail.classList.add('err');
    res.innerHTML = '<p class="msg-err">' + ech(t('f_req')) + '</p>';
    return;
  }
  if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(mail.value.trim())){
    mail.classList.add('err');
    res.innerHTML = '<p class="msg-err">' + ech(t('f_mailerr')) + '</p>';
    return;
  }
  res.innerHTML = '<div class="ok">' + t('f_ok') + '</div>';
}

function fermer(){

  document.getElementById('voile').classList.remove('on');

var x = new XMLHttpRequest();
x.open('GET', 'hotellerie.json', true);
x.onload = function(){
  if (x.status < 200 || x.status >= 300){ echec(x.status); return; }
  try { D = JSON.parse(x.responseText); }
  catch (e){ echec('JSON'); return; }
  demarrer();
};
/* Un chargement rate se DIT. Une grille vide et muette ressemble a une
   section vide, et c'est un mensonge d'un autre genre. */
x.onerror = function(){ echec('reseau'); };
function echec(code){
  document.getElementById('grille').innerHTML =
    '<div class="vide">hotellerie.json n\'a pas pu etre charge (' + ech(code) +
    '). Le fichier doit se trouver a cote de cette page.</div>';
}

function demarrer(){
  var m = location.search.match(/[?&]l=(fr|en)/);
  document.getElementById('q').addEventListener('input', function(){
    F.q = this.value; montre = PAS; tout();
  });
  document.getElementById('go').addEventListener('click', function(){
    F.q = document.getElementById('q').value; montre = PAS; tout();
  });
  document.getElementById('tri').addEventListener('change', function(){
    F.tri = this.value; rendre();
  });
  document.getElementById('plus').addEventListener('click', function(){
    montre += PAS; rendre();
  });
  document.getElementById('voile').addEventListener('click', fermer);
  var b = document.querySelectorAll('.lang button');
  for (var i=0;i<b.length;i++)
    b[i].addEventListener('click', function(){ langue(this.getAttribute('data-l')); });
  langue(m ? m[1] : 'fr');
}
</script>
